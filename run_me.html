<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoni Pramudya - Portfolio & Interactive Experience 2026</title>

  <!-- CDN Dependencies -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap"
    rel="stylesheet">

  <!-- Custom CSS -->
  <style>
    :root {
      --accent-color: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.5);
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      background-color: #020408;
      color: #f8fafc;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .bg-gradient-cinematic {
      background: radial-gradient(circle at 50% 0%, #0d1629 0%, #020408 75%);
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .glass-card-interactive {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card-interactive:hover {
      transform: translateY(-4px);
      border-color: rgba(96, 165, 250, 0.4);
      box-shadow: 0 20px 35px -10px rgba(59, 130, 246, 0.25);
    }

    .text-glow {
      text-shadow: 0 0 25px var(--accent-glow);
    }

    .text-glow-sm {
      text-shadow: 0 0 12px var(--accent-glow);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #020408;
    }

    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
    }

    /* CRT Scanline Overlay */
    .scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }

    /* Lucide icon default */
    .lucide {
      width: 20px;
      height: 20px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: inline-block;
      vertical-align: middle;
    }

    @keyframes pulseGlow {

      0%,
      100% {
        opacity: 0.4;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.05);
      }
    }

    .animate-pulse-glow {
      animation: pulseGlow 4s infinite ease-in-out;
    }

    @keyframes floatSlow {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .animate-float {
      animation: floatSlow 5s infinite ease-in-out;
    }
  </style>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            darkBg: '#020408',
            darkGradientStart: '#0d1629',
            brandBlue: '#3b82f6',
            brandPurple: '#8b5cf6',
            brandEmerald: '#10b981',
            brandAmber: '#f59e0b',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>
</head>

<body class="antialiased selection:bg-blue-500/30 selection:text-white">

  <div id="root"></div>

  <!-- React Code -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Web Audio Synthesizer (Zero-dependency sound generator) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.bgmPlaying = false;
        this.bgmOscs = [];
        this.bgmGain = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playHover() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.02, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch (e) { }
      }
      playClick() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(260, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch (e) { }
      }
      playLaser() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(880, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.12);
        } catch (e) { }
      }
      playExplosion() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          // Noise simulation
          const bufferSize = this.ctx.sampleRate * 0.15;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(600, this.ctx.currentTime);
          filter.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.15);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start();
        } catch (e) { }
      }
      playVictory() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const notes = [261.63, 329.63, 392.00, 523.25];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
            gain.gain.setValueAtTime(0.08, this.ctx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + (idx + 1) * 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.08);
            osc.stop(this.ctx.currentTime + (idx + 1) * 0.12);
          });
        } catch (e) { }
      }
      toggleBgm() {
        this.init();
        if (!this.ctx) return false;
        if (this.bgmPlaying) {
          this.stopBgm();
          return false;
        } else {
          this.startBgm();
          return true;
        }
      }
      startBgm() {
        if (this.bgmPlaying || !this.ctx) return;
        try {
          this.bgmGain = this.ctx.createGain();
          this.bgmGain.gain.setValueAtTime(0.03, this.ctx.currentTime);
          this.bgmGain.connect(this.ctx.destination);

          // Ambient chords: Dm9 (D, F, A, C, E) relaxing synth
          const freqs = [146.83, 174.61, 220.00, 261.63, 329.63];
          this.bgmOscs = freqs.map((f, i) => {
            const osc = this.ctx.createOscillator();
            osc.type = i % 2 === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(f, this.ctx.currentTime);
            // subtle detune for warmth
            osc.detune.setValueAtTime((i - 2) * 4, this.ctx.currentTime);
            osc.connect(this.bgmGain);
            osc.start();
            return osc;
          });
          this.bgmPlaying = true;
        } catch (e) { }
      }
      stopBgm() {
        if (!this.bgmPlaying) return;
        try {
          if (this.bgmOscs) {
            this.bgmOscs.forEach(o => {
              try { o.stop(); o.disconnect(); } catch (e) { }
            });
            this.bgmOscs = [];
          }
          if (this.bgmGain) {
            this.bgmGain.disconnect();
            this.bgmGain = null;
          }
          this.bgmPlaying = false;
        } catch (e) { }
      }
    }

    const sound = new SoundEngine();

    // Icon helper component
    const Icon = ({ name, className = '' }) => {
      useEffect(() => {
        if (window.lucide) {
          lucide.createIcons();
        }
      });
      return <i data-lucide={name} className={className}></i>;
    };

    // --- Interactive Particle Starfield Canvas for Hero ---
    const HeroCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = canvas.width = canvas.parentElement.offsetWidth;
        let height = canvas.height = canvas.parentElement.offsetHeight;

        const handleResize = () => {
          if (!canvas.parentElement) return;
          width = canvas.width = canvas.parentElement.offsetWidth;
          height = canvas.height = canvas.parentElement.offsetHeight;
        };
        window.addEventListener('resize', handleResize);

        const particles = Array.from({ length: 45 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.6 + 0.4,
          speedX: (Math.random() - 0.5) * 0.4,
          speedY: (Math.random() - 0.5) * 0.4,
          color: Math.random() > 0.4 ? 'rgba(59, 130, 246,' : 'rgba(139, 92, 246,',
          alpha: Math.random() * 0.5 + 0.2
        }));

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          // Draw grid lines
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
          ctx.lineWidth = 1;
          const gridSize = 60;
          for (let x = 0; x < width; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();
          }
          for (let y = 0; y < height; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
          }

          // Draw particles
          particles.forEach((p, idx) => {
            p.x += p.speedX;
            p.y += p.speedY;

            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            ctx.fillStyle = `${p.color} ${p.alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();

            // Link close particles
            for (let j = idx + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
              if (dist < 90) {
                ctx.strokeStyle = `rgba(59, 130, 246, ${0.15 * (1 - dist / 90)})`;
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
              }
            }
          });

          animationFrameId = requestAnimationFrame(render);
        };
        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none z-0" />;
    };

    // --- Mini-Game: CYBER BUG SLAYER 2026 ---
    const MiniGameModal = ({ isOpen, onClose, onShowToast }) => {
      const canvasRef = useRef(null);
      const [gameState, setGameState] = useState('PLAYING'); // 'PLAYING', 'GAMEOVER', 'VICTORY'
      const [score, setScore] = useState(0);
      const [lives, setLives] = useState(3);
      const [highScore, setHighScore] = useState(() => {
        return parseInt(localStorage.getItem('yp_highscore') || '0', 10);
      });

      useEffect(() => {
        if (!isOpen) return;
        sound.init();
        sound.playVictory();

        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        const cw = canvas.width = 640;
        const ch = canvas.height = 420;

        let player = {
          x: cw / 2 - 20,
          y: ch - 50,
          w: 40,
          h: 24,
          speed: 6,
          movingLeft: false,
          movingRight: false,
          lastShot: 0
        };

        let bullets = [];
        let enemies = [];
        let particles = [];
        let currentScore = 0;
        let currentLives = 3;
        let spawnTimer = 0;
        let isRunning = true;

        const bugLabels = ['404', 'NULL', 'BUG', 'SYNTAX', 'MERGE!'];
        const bugColors = ['#ef4444', '#f97316', '#ec4899', '#a855f7', '#eab308'];

        const spawnEnemy = () => {
          const typeIdx = Math.floor(Math.random() * bugLabels.length);
          enemies.push({
            x: Math.random() * (cw - 70) + 10,
            y: -30,
            w: 56,
            h: 24,
            speed: Math.random() * 1.5 + 1.2,
            text: bugLabels[typeIdx],
            color: bugColors[typeIdx]
          });
        };

        const handleKeyDown = (e) => {
          if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') player.movingLeft = true;
          if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') player.movingRight = true;
          if (e.code === 'Space' || e.code === 'KeyW' || e.key === 'w') {
            shoot();
            e.preventDefault();
          }
        };

        const handleKeyUp = (e) => {
          if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') player.movingLeft = false;
          if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') player.movingRight = false;
        };

        const shoot = () => {
          const now = Date.now();
          if (now - player.lastShot > 160) {
            bullets.push({
              x: player.x + player.w / 2 - 3,
              y: player.y - 8,
              w: 6,
              h: 14,
              speed: 9
            });
            player.lastShot = now;
            sound.playLaser();
          }
        };

        // Mouse & Touch support on canvas
        const handleCanvasMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const mouseX = (e.clientX - rect.left) * scaleX;
          player.x = Math.max(0, Math.min(cw - player.w, mouseX - player.w / 2));
        };

        const handleCanvasClick = (e) => {
          shoot();
        };

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        canvas.addEventListener('mousemove', handleCanvasMouseMove);
        canvas.addEventListener('click', handleCanvasClick);

        const loop = () => {
          if (!isRunning) return;

          // Clear
          ctx.fillStyle = '#050a14';
          ctx.fillRect(0, 0, cw, ch);

          // Starfield background
          ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
          for (let i = 0; i < 30; i++) {
            const sx = (i * 37 + (Date.now() * 0.05 * (i % 3 + 1))) % cw;
            const sy = (i * 29 + (Date.now() * 0.1 * (i % 2 + 1))) % ch;
            ctx.fillRect(sx, sy, 1.5, 1.5);
          }

          // Player movement
          if (player.movingLeft) player.x = Math.max(0, player.x - player.speed);
          if (player.movingRight) player.x = Math.min(cw - player.w, player.x + player.speed);

          // Draw Player Ship (Neon Cyber style)
          ctx.save();
          ctx.fillStyle = '#3b82f6';
          ctx.shadowColor = '#60a5fa';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.moveTo(player.x + player.w / 2, player.y);
          ctx.lineTo(player.x + player.w, player.y + player.h);
          ctx.lineTo(player.x + player.w / 2, player.y + player.h - 6);
          ctx.lineTo(player.x, player.y + player.h);
          ctx.closePath();
          ctx.fill();

          // Thruster flame
          ctx.fillStyle = Math.random() > 0.5 ? '#f97316' : '#eab308';
          ctx.beginPath();
          ctx.moveTo(player.x + player.w / 2 - 5, player.y + player.h - 4);
          ctx.lineTo(player.x + player.w / 2 + 5, player.y + player.h - 4);
          ctx.lineTo(player.x + player.w / 2, player.y + player.h + 8 + Math.random() * 6);
          ctx.closePath();
          ctx.fill();
          ctx.restore();

          // Bullets
          for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.y -= b.speed;
            ctx.fillStyle = '#38bdf8';
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 8;
            ctx.fillRect(b.x, b.y, b.w, b.h);

            if (b.y < -20) {
              bullets.splice(i, 1);
            }
          }

          // Spawn enemies
          spawnTimer++;
          if (spawnTimer % 45 === 0) {
            spawnEnemy();
          }

          // Enemies update & collisions
          for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
            const enemy = enemies[eIdx];
            enemy.y += enemy.speed;

            // Draw Enemy Card
            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.strokeStyle = enemy.color;
            ctx.lineWidth = 1.5;
            ctx.shadowColor = enemy.color;
            ctx.shadowBlur = 8;
            ctx.strokeRect(enemy.x, enemy.y, enemy.w, enemy.h);
            ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);

            ctx.fillStyle = enemy.color;
            ctx.font = 'bold 11px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(enemy.text, enemy.x + enemy.w / 2, enemy.y + 16);
            ctx.restore();

            // Check hit by bullet
            for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
              const b = bullets[bIdx];
              if (
                b.x > enemy.x &&
                b.x < enemy.x + enemy.w &&
                b.y > enemy.y &&
                b.y < enemy.y + enemy.h
              ) {
                // Enemy destroyed!
                sound.playExplosion();
                // Explosion particles
                for (let p = 0; p < 8; p++) {
                  particles.push({
                    x: enemy.x + enemy.w / 2,
                    y: enemy.y + enemy.h / 2,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    color: enemy.color,
                    life: 20
                  });
                }
                enemies.splice(eIdx, 1);
                bullets.splice(bIdx, 1);
                currentScore += 100;
                setScore(currentScore);
                break;
              }
            }

            // Check enemy reached bottom or hit player
            if (enemy.y > ch - 15) {
              enemies.splice(eIdx, 1);
              currentLives -= 1;
              setLives(currentLives);
              sound.playLaser();
              if (currentLives <= 0) {
                isRunning = false;
                setGameState('GAMEOVER');
                if (currentScore > highScore) {
                  localStorage.setItem('yp_highscore', currentScore.toString());
                  setHighScore(currentScore);
                  onShowToast('🎉 Rekor Baru Tercipta! Skor: ' + currentScore);
                }
                break;
              }
            }
          }

          // Particles
          for (let pIdx = particles.length - 1; pIdx >= 0; pIdx--) {
            const p = particles[pIdx];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 3, 3);
            if (p.life <= 0) particles.splice(pIdx, 1);
          }

          if (isRunning) {
            animId = requestAnimationFrame(loop);
          }
        };

        animId = requestAnimationFrame(loop);

        return () => {
          isRunning = false;
          cancelAnimationFrame(animId);
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
          if (canvas) {
            canvas.removeEventListener('mousemove', handleCanvasMouseMove);
            canvas.removeEventListener('click', handleCanvasClick);
          }
        };
      }, [isOpen, gameState]);

      if (!isOpen) return null;

      const resetGame = () => {
        setScore(0);
        setLives(3);
        setGameState('PLAYING');
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
          <div className="relative w-full max-w-2xl glass-card rounded-2xl border border-blue-500/30 overflow-hidden shadow-2xl">
            {/* Header */}
            <div className="flex items-center justify-between px-6 py-4 border-b border-white/10 bg-slate-900/80">
              <div className="flex items-center gap-3">
